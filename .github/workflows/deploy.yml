name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: sample-service

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Save Image Metadata
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

  terraform-plan:
    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/envs/prod

      - name: Terraform Plan
        run: |
          terraform plan \
          -var="image=${{ github.sha }}" \
          -out=tfplan
        working-directory: terraform/envs/prod

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/envs/prod/tfplan

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    needs:
      - terraform-plan

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@project-id.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform/envs/prod

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/envs/prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform/envs/prod