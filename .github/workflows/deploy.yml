name: Production Deployment Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  GAR_LOCATION: us-central1
  GAR_REPOSITORY: app-repo
  IMAGE_NAME: sample-service

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image-info.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        id: image-info
        run: |
          FULL_IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t $FULL_IMAGE_URI .
          docker push $FULL_IMAGE_URI
          echo "image_uri=$FULL_IMAGE_URI" >> $GITHUB_OUTPUT

  terraform-plan:
    name: Terraform Plan (Prod)
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init (Prod)
        run: terraform init "-backend-config=environments/prod/backend.tfbackend" -reconfigure
        working-directory: terraform

      - name: Terraform Plan
        run: |
          terraform plan \
            "-var-file=environments/prod/prod.tfvars" \
            -var="image=${{ needs.build-and-push.outputs.image_uri }}" \
            -out=tfplan
        working-directory: terraform

      - name: Upload Execution Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  deploy:
    name: Apply Deployment (Prod)
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build-and-push
      - terraform-plan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP using OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/123456789/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@your-gcp-project-id.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init (Prod)
        run: terraform init "-backend-config=environments/prod/backend.tfbackend" -reconfigure
        working-directory: terraform

      - name: Download Execution Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform